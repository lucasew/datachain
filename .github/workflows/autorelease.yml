name: autorelease

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autorelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Install
        run: mise run install

      - name: Codegen
        run: mise run codegen

      - name: Check for changes
        id: git-check
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR if changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          BRANCH_NAME="codegen-update-${{ github.run_id }}"
          git checkout -b $BRANCH_NAME
          git add .
          git commit -m "chore: update generated code"
          git push origin $BRANCH_NAME
          gh pr create --title "chore: update generated code" --body "Automated PR to update generated code." --base main --head $BRANCH_NAME || echo "PR creation failed. Continuing."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: CI
        run: mise run ci

      - name: Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(cat datachain/VERSION)
          gh release create $VERSION --generate-notes || echo "Release $VERSION might already exist or failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
